flutter_launcher_icons:
  image_path: assets/icon/icon-beta.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: assets/icon/foreground-beta.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/monochrome-beta.png
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#121212"
  image_path_ios_dark_transparent: assets/icon/icon-dark-beta.png
  image_path_ios_tinted_grayscale: assets/icon/icon-tinted-beta.png
  macos:
    generate: true
    image_path: assets/icon/icon-macos-beta.png
