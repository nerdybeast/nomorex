name: nomorex
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.3.0
  intl: any
  collection: any
  sentry_flutter: ^10.3.0
  haptic_feedback: ^0.6.5
  image_picker: ^1.2.4
  file_selector: ^1.1.0
  image: ^4.12.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  sentry_dart_plugin: ^3.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled so text renders correctly offline and the app never contacts
  # Google Fonts at runtime. These are the same static files google_fonts
  # used to download. The OFL texts are registered with LicenseRegistry in
  # lib/main.dart.
  assets:
    - assets/fonts/Inter/OFL.txt
    - assets/fonts/JetBrainsMono/OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Medium.ttf
          weight: 500

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# sentry_dart_plugin: uploads iOS debug symbols (dSYMs) and web source maps so
# Sentry can show readable stack traces. Run by the deploy workflows only, with
# SENTRY_AUTH_TOKEN from a repository secret; SENTRY_RELEASE / SENTRY_DIST
# come from the environment there, matching what the app reports. See
# docs/build.md.
sentry:
  org: michael-penrod
  project: nomorex
  upload_debug_symbols: true
  upload_source_maps: true
  # Source context in Sentry; the repo is public anyway.
  upload_sources: true
  # No Sentry <-> GitHub repository integration is set up.
  commits: false
  symbols_path: build
  # upload_sources sends the whole repo; skip what never runs in the deployed
  # app. Never add build/**: the plugin also matches these against the
  # absolute path of each built JS file, so it would skip debug ID injection
  # for build/web and break web symbolication.
  ignore_web_source_paths:
    - test/**
    - integration_test/**
    - web/**

# App icon (Option D "Tally" from the NoMoreX App Icon design canvas).
# Sources are assets/icon/*.svg; render them with ./scripts/render-icons.sh,
# then regenerate every platform with `dart run flutter_launcher_icons`.
# Never hand-edit the generated PNGs under ios/ android/ macos/ windows/ web/.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: assets/icon/foreground.png
  # The artwork already sits inside the adaptive safe zone at full size.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/monochrome.png
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#121212"
  image_path_ios_dark_transparent: assets/icon/icon-dark.png
  image_path_ios_tinted_grayscale: assets/icon/icon-tinted.png
  web:
    generate: true
    background_color: "#121212"
    theme_color: "#121212"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/icon-macos.png

# Launch/splash screen: the Tally mark centred on the app's own bg-0
# (#FAFAFA light, #121212 dark) so there's no colour flash when Flutter's
# first frame replaces it. Sources are assets/icon/splash-*.svg; render with
# ./scripts/render-icons.sh, then `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#FAFAFA"
  color_dark: "#121212"
  image: assets/icon/splash-light.png
  image_dark: assets/icon/splash-dark.png
  android_12:
    color: "#FAFAFA"
    color_dark: "#121212"
    image: assets/icon/splash-android12-light.png
    image_dark: assets/icon/splash-android12-dark.png
  android: true
  ios: true
  web: true
