name: genkit_apple_intelligence
description: A Genkit model for Apple Intelligence (Foundation Models) on iOS and macOS.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  genkit: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.1
  schemantic: ^1.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: GenkitAppleIntelligencePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: GenkitAppleIntelligencePlugin
        sharedDarwinSource: true
