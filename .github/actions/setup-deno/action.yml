name: Set up Deno
description: Installs the Deno version the Supabase edge runtime ships. Every workflow uses this, so the version lives here only.

runs:
  using: composite
  steps:
    - uses: denoland/setup-deno@v2
      with:
        # Matches the Deno the Supabase edge runtime ships (2.1.x, printed by
        # `supabase functions serve`), so CI type-checks against what actually
        # runs. Bump together with the runtime. scripts/lib/cloud.sh
        # (`read_pins`) and scripts/verify.sh read this line, so keep the key
        # and format.
        deno-version: 2.1.4
