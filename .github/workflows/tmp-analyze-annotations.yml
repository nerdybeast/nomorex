# TEMPORARY — remove before merging. Surfaces `flutter analyze` and test
# failures as check-run annotations so they can be read through the GitHub
# API from an environment that can't download raw job logs.
name: Analyze Annotations (temporary)

on:
  push:
    branches: [feat/sleek-orange-v3-restyle]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (as annotations)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings --format=machine > analyze.txt 2>&1 || true
          cat analyze.txt
          n=0
          while IFS='|' read -r sev type code file line col len msg; do
            case "$sev" in INFO|WARNING|ERROR) ;; *) continue ;; esac
            n=$((n+1))
            rel="${file#"$GITHUB_WORKSPACE"/}"
            echo "::error file=$rel,line=$line,col=$col::[$sev $code] $msg"
          done < analyze.txt
          echo "::notice::analyzer issues: $n"
      - name: Analyze (plain exit code)
        if: always()
        run: |
          set +e
          flutter analyze > plain.txt 2>&1
          code=$?
          tail -5 plain.txt | tr '\n' ' ' | sed 's/^/::notice::analyze exit '"$code"': /'
          echo
      - name: Test (as annotations)
        if: always()
        run: |
          flutter test --machine > results.jsonl || true
          python3 - <<'PY'
          import json
          names, errs, prints = {}, {}, {}
          for line in open('results.jsonl'):
              line = line.strip()
              if not line.startswith('{'): continue
              try: e = json.loads(line)
              except Exception: continue
              t = e.get('type')
              if t == 'testStart':
                  test = e['test']; names[test['id']] = (test['name'], (test.get('url') or '').split('/')[-1])
              elif t == 'error':
                  errs.setdefault(e['testID'], []).append(e.get('error', ''))
              elif t == 'print':
                  prints.setdefault(e['testID'], []).append(e.get('message', ''))
          for tid, es in errs.items():
              name, url = names.get(tid, ('?', '?'))
              log = '\n'.join(prints.get(tid, []))
              # Keep the exception headline and the first frames.
              i = log.find('EXCEPTION CAUGHT')
              log = log[i:i + 2500] if i >= 0 else log[:2500]
              msg = (log or ' | '.join(es))[:2500].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f"::error::{url} :: {name} :: {msg}")
          PY
