name: Determine app version

# Single source for the app version, so every workflow that builds or tests the
# app can tie its result to the same number (see GitVersion.yaml for the rules).
#
# Deliberately pinned to a GitHub-hosted runner: GitVersion needs .NET, which
# the custom ARC runner image doesn't carry. Self-hosted jobs just consume the
# outputs.
on:
  workflow_call:
    outputs:
      build-name:
        description: MajorMinorPatch, e.g. 1.4.2 (passed to --build-name)
        value: ${{ jobs.version.outputs.build-name }}
      build-number:
        description: Commit count, only ever increases (passed to --build-number)
        value: ${{ jobs.version.outputs.build-number }}
      semver:
        description: Full semantic version incl. pre-release label, e.g. 1.4.2-my-branch.3
        value: ${{ jobs.version.outputs.semver }}

jobs:
  version:
    name: Determine app version
    runs-on: ubuntu-latest
    outputs:
      build-name: ${{ steps.app-version.outputs.build-name }}
      build-number: ${{ steps.app-version.outputs.build-number }}
      semver: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion and the commit count both need full history and tags.
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: 6.x

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      # build-number is the commit count so it only ever increases (Android's
      # versionCode must).
      - name: Compute app version
        id: app-version
        run: |
          build_name="${{ steps.gitversion.outputs.majorMinorPatch }}"
          build_number="$(git rev-list --count HEAD)"
          echo "App version: $build_name+$build_number (${{ steps.gitversion.outputs.semVer }})"
          echo "build-name=$build_name" >> "$GITHUB_OUTPUT"
          echo "build-number=$build_number" >> "$GITHUB_OUTPUT"
