name: Deploy iOS (TestFlight)

on:
  push:
    branches: [main]
    # Same idea as deploy.yml's list, but for the iOS app: skip pushes that
    # can't change the built IPA. ios/** is deliberately *not* ignored here,
    # while the other platforms' folders (and web/) are. workflow_dispatch
    # stays available to force a run either way.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'test/**'
      - 'integration_test/**'
      - 'scripts/**'
      # Migrations are deployed by the Supabase GitHub integration, not here.
      - 'supabase/**'
      - 'android/**'
      - 'web/**'
      - 'macos/**'
      - 'linux/**'
      - 'windows/**'
      - '.github/workflows/pr-checks.yml'
      - '.github/workflows/deploy.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight upload; queue the next one behind it instead.
concurrency:
  group: deploy-ios
  cancel-in-progress: false

jobs:
  # Same version source as the web deploy, so a TestFlight build and the web
  # app published from one commit carry the same number. build-number is the
  # commit count, which only ever increases, as App Store Connect requires.
  determine-version:
    uses: ./.github/workflows/version.yml

  testflight:
    name: Build & upload to TestFlight
    needs: determine-version
    # Free on a public repo; a private repo would bill these minutes at the
    # macOS multiplier.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # The runner context isn't available in job-level env, so the paths
      # are exported here for the later steps.
      - name: Set build paths
        run: |
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          # Under build/ios/archive (gitignored) because that's where
          # sentry_dart_plugin looks for the dSYMs to upload.
          echo "ARCHIVE_PATH=$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/export" >> "$GITHUB_ENV"

      - name: Record app version
        run: |
          echo "**App version:** \`${{ needs.determine-version.outputs.build-name }}\` (build ${{ needs.determine-version.outputs.build-number }})" >> "$GITHUB_STEP_SUMMARY"

      # App Store Connect only accepts builds made with a current SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to match pr-checks.yml and deploy.yml. Bump all three together.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # An unset secret expands to an empty string rather than failing the
      # build, which would ship an app that silently cannot reach Supabase,
      # or fail much later with an opaque signing error.
      - name: Verify build secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_DEV_CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          missing=()
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8 IOS_DEV_CERT_P12 IOS_DEV_CERT_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Set them under Settings > Secrets and variables > Actions (see docs/build.md)."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL must start with https:// (got a value of length ${#SUPABASE_URL})"; exit 1 ;;
          esac

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          echo "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$ASC_KEY_PATH" || {
            echo "::error::APP_STORE_CONNECT_API_KEY_P8 did not decode to a .p8 private key. Store it as: base64 -i AuthKey_XXXX.p8"
            exit 1
          }

      # Bakes the dart-defines and version into ios/Flutter/Generated.xcconfig
      # without building or signing. The archive below then runs the normal
      # Flutter build phase with those values. `flutter build ipa` would be
      # simpler, but it can't pass the API-key auth flags through to xcodebuild.
      - name: Configure Flutter iOS build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: nomorex@${{ needs.determine-version.outputs.build-name }}+${{ needs.determine-version.outputs.build-number }}
          SENTRY_DIST: ${{ needs.determine-version.outputs.build-number }}
        run: |
          flutter build ios --release --config-only \
            --build-name="${{ needs.determine-version.outputs.build-name }}" \
            --build-number="${{ needs.determine-version.outputs.build-number }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_ENVIRONMENT=production \
            --dart-define=SENTRY_RELEASE="$SENTRY_RELEASE" \
            --dart-define=SENTRY_DIST="$SENTRY_DIST"

      # The archive must be signed (an unsigned one fails export: Xcode
      # replaces the static Sentry.framework binary with a stub that only
      # the archive's CodeSign step signs properly). Release signs with an
      # Apple Development identity, which isn't cloud-managed: its private
      # key has to be in the local keychain. A fresh runner's keychain is
      # empty, so without this step Xcode minted a brand-new development
      # certificate on every run until the account hit Apple's cap ("Your
      # account has reached the maximum number of certificates"). Importing
      # one long-lived certificate from secrets makes every run reuse it.
      - name: Install development signing certificate
        env:
          IOS_DEV_CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/dev-cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "$IOS_DEV_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DEV_CERT_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # Put it on the search list so Xcode's automatic signing finds it.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          # If the identity didn't import, Xcode would quietly create a new
          # certificate again, so stop here instead.
          identities="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          echo "$identities"
          grep -q "Apple Development" <<< "$identities" || {
            echo "::error::IOS_DEV_CERT_P12 didn't import as an Apple Development signing identity (certificate + private key). See docs/build.md."
            exit 1
          }

      # -allowProvisioningUpdates plus the API key lets Xcode fetch/refresh
      # the development profile for the certificate imported above.
      - name: Archive
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            | tee "$RUNNER_TEMP/xcodebuild-archive.log"
          # Certificates Xcode creates through the API key are named
          # "Created via API". Seeing one means the imported certificate
          # wasn't used (expired or revoked?) and a new one was just minted.
          if grep -q 'Signing Identity:.*Created via API' "$RUNNER_TEMP/xcodebuild-archive.log"; then
            echo "::error::Xcode created a new development certificate instead of using IOS_DEV_CERT_P12. Revoke the new 'Created via API' certificate and check the secret (docs/build.md)."
            exit 1
          fi

      # ios/ExportOptions.plist has destination=upload, so this step signs
      # the IPA for App Store distribution and uploads it to App Store Connect.
      # -allowProvisioningUpdates plus the API key lets Xcode use the team's
      # cloud-managed distribution certificate (one shared cert, never a new
      # one per run) and create/refresh the App Store profile itself, so no
      # .p12 or profile is stored in secrets.
      - name: Export & upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            | tee "$RUNNER_TEMP/xcodebuild-export.log"
          echo "Uploaded ${{ needs.determine-version.outputs.build-name }} (${{ needs.determine-version.outputs.build-number }}) to App Store Connect. It appears in TestFlight once Apple finishes processing." >> "$GITHUB_STEP_SUMMARY"

      # dSYMs make native iOS crashes readable in Sentry (Apple gets its own
      # copy via uploadSymbols in ExportOptions.plist). The build has already
      # shipped by now, so a missing token only warns.
      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: nomorex@${{ needs.determine-version.outputs.build-name }}+${{ needs.determine-version.outputs.build-number }}
          SENTRY_DIST: ${{ needs.determine-version.outputs.build-number }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN is not set; skipping the Sentry dSYM upload. Native iOS crashes in Sentry will be unsymbolicated."
            exit 0
          fi
          dart run sentry_dart_plugin --sentry-define=upload_source_maps=false

      - name: Upload xcodebuild logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/xcodebuild-*.log
            ${{ runner.temp }}/export/*.log
          if-no-files-found: ignore

      - name: Remove App Store Connect API key and signing keychain
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH"
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
