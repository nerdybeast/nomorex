name: Self-Hosted Test

on:
  push:

jobs:
  test:
    name: Flutter Test
    runs-on: arc-runner-set

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the pin in pr-checks.yml.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test
