name: Self-Hosted Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Flutter Test
    runs-on: arc-runner-set

    steps:
      - uses: actions/checkout@v7

      - name: Install xz-utils
        run: sudo apt-get update && sudo apt-get install -y xz-utils

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the pin in pr-checks.yml.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage --branch-coverage

      - name: Write coverage to job summary
        uses: livewing/lcov-job-summary@v1.3.0
        with:
          lcov: coverage/lcov.info

      # Deploy builds a release web bundle (see deploy.yml); this only proves
      # that target still compiles in release mode, so the values just need
      # to be well-formed, not real.
      - name: Build web (release)
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=https://placeholder.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_placeholder