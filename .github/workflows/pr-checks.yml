name: PR Checks

on:
  pull_request:
    branches: [main]
    # Deliberately much shorter than deploy.yml's list: these jobs depend on
    # nearly everything that can't affect the web bundle. test/ and
    # integration_test/ are what `flutter test` and the e2e suite run,
    # scripts/ holds e2e.sh, supabase/ is what db-validate resets and lints,
    # android/ is what build-android builds, ios/ is what build-ios builds,
    # and linux/ is the desktop target e2e compiles — none of them can be
    # ignored. Only genuinely unused
    # platform folders and prose are safe.
    #
    # If these checks are ever made required in branch protection, revisit
    # this: a skipped workflow never reports, so a required check would wait
    # for a status that never arrives and block the merge.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'macos/**'
      - 'windows/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-ios.yml'
      - '.gitignore'
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: these jobs only check out code and read
# tags/history; nothing here writes to the repo.
permissions:
  contents: read

jobs:
  version:
    uses: ./.github/workflows/version.yml

  checks:
    name: Analyze & Test
    needs: version
    runs-on: ubuntu-latest

    # No setup-java here: Java is only needed for the Android Gradle build,
    # which now lives in the build-android job.
    steps:
      - uses: actions/checkout@v7

      # Ties this run's result to the exact version it was built/tested as.
      - name: Record app version
        run: |
          echo "**App version:** \`${{ needs.version.outputs.semver }}\` (build ${{ needs.version.outputs.build-name }}+${{ needs.version.outputs.build-number }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get

      # *.g.dart files are committed; this fails the PR if one is stale.
      # Fix: dart run build_runner build --delete-conflicting-outputs, commit.
      - name: Check generated files are up to date
        run: ./scripts/check-generated.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage --branch-coverage

      # Pure Dart, so the root `flutter test` doesn't run it.
      - name: Test the import pipeline package
        working-directory: packages/import_pipeline
        run: dart pub get && dart analyze --fatal-infos && dart test

      # Plugin packages with their own tests, which the root `flutter test`
      # doesn't run. Their Swift is compiled by build-ios.
      - name: Test the Apple Intelligence plugin package
        working-directory: packages/genkit_apple_intelligence
        run: flutter pub get && flutter analyze --fatal-infos && flutter test

      # Same for Gemini Nano's; build-android compiles its Kotlin.
      - name: Test the ML Kit GenAI plugin package
        working-directory: packages/genkit_mlkit_genai
        run: flutter pub get && flutter analyze --fatal-infos && flutter test

      - name: Write coverage to job summary
        uses: livewing/lcov-job-summary@v1.3.0
        with:
          lcov: coverage/lcov.info

  build-web:
    name: Build Web (${{ matrix.mode }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug, profile]

    steps:
      - uses: actions/checkout@v7

      # Ties this run's result to the exact version it was built/tested as.
      - name: Record app version
        run: |
          echo "**App version:** \`${{ needs.version.outputs.semver }}\` (build ${{ needs.version.outputs.build-name }}+${{ needs.version.outputs.build-number }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get

      # Deploy builds a release web bundle (see deploy.yml); this proves the
      # target still compiles in every build mode, so the values just need
      # to be well-formed, not real.
      - name: Build web (${{ matrix.mode }})
        run: |
          flutter build web --${{ matrix.mode }} \
            --build-name="${{ needs.version.outputs.build-name }}" \
            --build-number="${{ needs.version.outputs.build-number }}" \
            --dart-define=SUPABASE_URL=https://placeholder.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_placeholder

  build-android:
    name: Build Android APK (${{ matrix.flavor }}, ${{ matrix.mode }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every mode as the local flavor, plus a release build of each other
        # flavor: the flavors differ in application id, name and Firebase
        # config, not in code, so one mode each proves they build.
        mode: [release, debug, profile]
        flavor: [local]
        include:
          - mode: release
            flavor: beta
          - mode: release
            flavor: production

    # Split out of `checks` because the Gradle build dominated that job's
    # runtime. On its own runner it no longer gates analyze/test feedback.
    steps:
      - uses: actions/checkout@v7

      # Ties this run's result to the exact version it was built/tested as.
      - name: Record app version
        run: |
          echo "**App version:** \`${{ needs.version.outputs.semver }}\` (build ${{ needs.version.outputs.build-name }}+${{ needs.version.outputs.build-number }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get

      # Release is signed with the debug keys (see android/app/build.gradle.kts),
      # so all three modes build without any signing secrets.
      - name: Build APK (${{ matrix.flavor }}, ${{ matrix.mode }})
        run: |
          flutter build apk --${{ matrix.mode }} --flavor ${{ matrix.flavor }} \
            --dart-define=APP_ENV=${{ matrix.flavor }} \
            --build-name="${{ needs.version.outputs.build-name }}" \
            --build-number="${{ needs.version.outputs.build-number }}"

  build-ios:
    name: Build iOS (${{ matrix.flavor }}, release, unsigned)
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # The flavors differ in bundle id, name and Firebase config, so each
        # one's Xcode configuration is built before merge.
        flavor: [local, beta, production]
    # Free on a public repo. Proves the iOS target still compiles before
    # merge, since deploy-ios.yml only runs after it.
    runs-on: macos-26
    env:
      # Builds firebase_analytics without Google's advertising-ID SDKs (no ads;
      # see web/privacy.html). Same setting as deploy-ios.yml.
      FIREBASE_ANALYTICS_WITHOUT_ADID: 'true'

    steps:
      - uses: actions/checkout@v7

      # Ties this run's result to the exact version it was built/tested as.
      - name: Record app version
        run: |
          echo "**App version:** \`${{ needs.version.outputs.semver }}\` (build ${{ needs.version.outputs.build-name }}+${{ needs.version.outputs.build-number }})" >> "$GITHUB_STEP_SUMMARY"

      # Same Xcode selection as deploy-ios.yml, so the two can't drift apart.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get

      # Signing and upload happen only in deploy-ios.yml. This only needs to
      # compile, so placeholder values are enough.
      - name: Build iOS (${{ matrix.flavor }}, release, no codesign)
        run: |
          flutter build ios --release --no-codesign --flavor ${{ matrix.flavor }} \
            --dart-define=APP_ENV=${{ matrix.flavor }} \
            --build-name="${{ needs.version.outputs.build-name }}" \
            --build-number="${{ needs.version.outputs.build-number }}" \
            --dart-define=SUPABASE_URL=https://placeholder.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_placeholder

      - name: Check no advertising-ID SDKs are bundled
        run: ./scripts/check-ios-no-adid.sh build/ios/iphoneos/Runner.app

  db-validate:
    name: Validate DB migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-supabase

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations from scratch
        run: supabase db reset

      - name: Lint database
        run: supabase db lint

      # pgTAP tests under supabase/tests/, run as the seeded users against the
      # stack reset above. Local only: never --linked.
      - name: Database tests (pgTAP)
        run: supabase test db --local

  # Edge functions: `ai` (Genkit) and `ai-import-cleanup`. Unit tests use fakes
  # for the model and Supabase: no network, no API key, no local stack.
  functions:
    name: Edge functions (Deno, ${{ matrix.function }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function: [ai, ai-import-cleanup]
    defaults:
      run:
        working-directory: supabase/functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-deno

      # fmt --check, lint, type-check the entry points, run the tests.
      - name: Check & test
        run: deno task check

  e2e:
    name: E2E (integration_test)
    needs: version
    runs-on: ubuntu-latest

    # Runs on Linux desktop rather than macOS: the suite needs a real Supabase
    # stack, `supabase start` needs Docker, and GitHub-hosted macOS runners
    # don't ship Docker. The test files are platform-agnostic Dart — locally
    # the same suite runs against `-d macos` via ./scripts/e2e.sh.
    steps:
      - uses: actions/checkout@v7

      # Ties this run's result to the exact version it was built/tested as.
      - name: Record app version
        run: |
          echo "**App version:** \`${{ needs.version.outputs.semver }}\` (build ${{ needs.version.outputs.build-name }}+${{ needs.version.outputs.build-number }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/setup-supabase

      - uses: ./.github/actions/setup-flutter

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libcurl4-openssl-dev libsecret-1-dev \
            xvfb dbus gnome-keyring

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      # scripts/e2e.sh starts Supabase, resets the DB (--reset, so CI always
      # starts from the seed), and reads the API URL and publishable key off
      # the running stack (there's no .env.local.json in CI). The whole suite is
      # one build and launch. xvfb provides the display the desktop app needs,
      # and with-keyring.sh the unlocked keyring its key storage needs.
      - name: Run E2E suite
        run: xvfb-run -a ./scripts/with-keyring.sh ./scripts/e2e.sh linux --reset
