name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK (debug)
        run: flutter build apk --debug

      # Deploy builds a release web bundle (see deploy.yml); this only proves
      # that target still compiles in release mode, so the values just need
      # to be well-formed, not real.
      - name: Build web (release)
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=https://placeholder.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_placeholder

  db-validate:
    name: Validate DB migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations from scratch
        run: supabase db reset

      - name: Lint database
        run: supabase db lint

  e2e:
    name: E2E (integration_test)
    runs-on: ubuntu-latest

    # Runs on Linux desktop rather than macOS: the suite needs a real Supabase
    # stack, `supabase start` needs Docker, and GitHub-hosted macOS runners
    # don't ship Docker. The test files are platform-agnostic Dart — locally
    # the same suite runs against `-d macos` via ./scripts/e2e.sh.
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            xvfb

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      # scripts/e2e.sh starts Supabase, resets the DB, and reads the API URL
      # and publishable key off the running stack (there's no .env.local.json
      # in CI). xvfb provides the display the desktop app needs.
      - name: Run E2E suite
        run: xvfb-run -a ./scripts/e2e.sh linux
