name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK (debug)
        run: flutter build apk --debug

      # Deploy builds a release web bundle (see deploy.yml); this only proves
      # that target still compiles in release mode, so the values just need
      # to be well-formed, not real.
      - name: Build web (release)
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=https://placeholder.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_placeholder

  db-validate:
    name: Validate DB migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations from scratch
        run: supabase db reset

      - name: Lint database
        run: supabase db lint
