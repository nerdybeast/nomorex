name: Deploy

on:
  push:
    branches: [main]
    # Skip the deploy when a push touches nothing that can change the built web
    # app. Evaluated across every commit in the push, so a docs-only push is
    # skipped while a push mixing docs with lib/ still deploys. deploy.yml
    # itself is deliberately absent — editing it should deploy — and
    # workflow_dispatch below stays available to force a run either way.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'test/**'
      - 'integration_test/**'
      - 'scripts/**'
      # Migrations are deployed by the Supabase GitHub integration, not here.
      - 'supabase/**'
      - 'android/**'
      - 'ios/**'
      - 'macos/**'
      - 'linux/**'
      - 'windows/**'
      - '.github/workflows/pr-checks.yml'
      - '.gitignore'
  workflow_dispatch:

# Allow this workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping deploys
concurrency:
  group: deploy-main
  cancel-in-progress: false

# Database migrations are applied by the Supabase GitHub integration, which
# watches supabase/ and deploys on push to main. This workflow only builds and
# publishes the web app.
jobs:
  # The app version comes from GitVersion (see GitVersion.yaml), not pubspec.yaml:
  # the pubspec `version:` is only a fallback for local builds, and the values
  # below override it via --build-name/--build-number.
  determine-version:
    name: Determine app version
    runs-on: ubuntu-latest
    outputs:
      build-name: ${{ steps.app-version.outputs.build-name }}
      build-number: ${{ steps.app-version.outputs.build-number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # GitVersion and the commit count both need full history and tags.
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: 6.x

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      # build-name is the semantic version; build-number is the commit count so
      # it only ever increases (Android's versionCode must).
      - name: Compute app version
        id: app-version
        run: |
          build_name="${{ steps.gitversion.outputs.majorMinorPatch }}"
          build_number="$(git rev-list --count HEAD)"
          echo "App version: $build_name+$build_number"
          echo "build-name=$build_name" >> "$GITHUB_OUTPUT"
          echo "build-number=$build_number" >> "$GITHUB_OUTPUT"

  deploy-web:
    name: Build & deploy web
    needs: determine-version
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to match pr-checks.yml: `channel: stable` floats, so an
          # unpinned deploy could publish from a different Flutter than the
          # one the PR was verified against. Bump both together.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # An unset secret expands to an empty string rather than failing the build,
      # which would publish a web app that silently cannot reach Supabase.
      - name: Verify Supabase build secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=()
          [ -n "$SUPABASE_URL" ] || missing+=(SUPABASE_URL)
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || missing+=(SUPABASE_PUBLISHABLE_KEY)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Set them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL must start with https:// (got a value of length ${#SUPABASE_URL})"; exit 1 ;;
          esac

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build web --release \
            --build-name="${{ needs.determine-version.outputs.build-name }}" \
            --build-number="${{ needs.determine-version.outputs.build-number }}" \
            --base-href="/${GITHUB_REPOSITORY#*/}/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Releasing after a successful deploy keeps the tag in step with what was
  # actually published, and the tag is what lets GitVersion advance on the next
  # run. Most deploys share a MajorMinorPatch (only a tagged bump changes it),
  # so an existing tag is left alone.
  release:
    name: Create GitHub release
    needs: [determine-version, deploy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.determine-version.outputs.build-name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --generate-notes
          fi
