name: Deploy edge functions

# The Supabase GitHub integration can't deploy the `ai` function: it bundles on
# Supabase's servers, which allow 5 MB, and Genkit brings the function to about
# 18.7 MB. The CLI bundles locally with Docker, which allows 20 MB. Migrations
# are still applied by the integration.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/ai/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_REF: tlojfeebipuobfhiknps

jobs:
  deploy-ai:
    name: Deploy ai function
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          # Same pin as pr-checks.yml, so they move together.
          version: 2.116.0

      # JWT verification stays on: this deliberately doesn't pass
      # --no-verify-jwt. --yes because a workflow can't answer the CLI's
      # confirmation prompt for hosted changes.
      - name: Deploy
        run: supabase functions deploy ai --project-ref "$PROJECT_REF" --yes

      - name: Confirm the function requires a signed-in user
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"data":{}}' \
            "https://$PROJECT_REF.supabase.co/functions/v1/ai/smokeTest")
          echo "Unauthenticated request returned HTTP $status"
          test "$status" = "401"
